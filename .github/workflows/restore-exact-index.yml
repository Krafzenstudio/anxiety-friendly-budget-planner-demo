name: Restore exact index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact index.html bytes
        run: |
          git show dfbba242cf9a9320058ef6ca411b5152f7f2c4ef:KrafzenStudio_Anxiety_Friendly_Budget_Planner_v2_DEMO.html > index.html
          wc -c index.html
          git status --short
      - name: Commit and push if changed
        run: |
          git config user.name "Krafzenstudio"
          git config user.email "khurramn988@gmail.com"
          git add index.html
          git commit -m "Restore exact index.html bytes" || echo "nothing to commit"
          git push
