name: Restore exact index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact index.html bytes
        run: |
          cp "KrafzenStudio_Anxiety_Friendly_Budget_Planner_v2_DEMO.html" index.html
          test "$(git hash-object index.html)" = "fe39cc1307f028b31bf1edec54cbecc2d78aa304"
          rm "KrafzenStudio_Anxiety_Friendly_Budget_Planner_v2_DEMO.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore exact index.html bytes"
          git push
