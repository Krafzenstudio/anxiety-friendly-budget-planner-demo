function nav(){let n=$("#nav");n.innerHTML=screens.map((s,i)=>`<button data-screen="${s}" class="${state.screen===s?'active':''}"><span class="ico">${icons[i]}</span>${s}${(s==='Debt'||s==='Worry Inbox'||s==='Calm Plan')?' 🔒':''}</button>`).join("");n.querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.screen));let m=$("#mobileNav");m.innerHTML=screens.map(s=>`<option value="${s}" ${state.screen===s?'selected':''}>${s}${(s==='Debt'||s==='Worry Inbox'||s==='Calm Plan')?' 🔒':''}</option>`).join("")}

function head(k,title,sub=""){return `<div class="pagehead"><div class="eyebrow">${k}</div><h1>${title}</h1>${sub?`<p>${sub}</p>`:""}</div>`}
function card(content,cls=""){return `<article class="card ${cls}">${content}</article>`}
function bar(p){return `<div class="bar"><span style="width:${Math.max(0,Math.min(100,p))}%"></span></div>`}
function row(a,b,small=""){return `<div class="item"><div><strong>${a}</strong>${small?`<small>${small}</small>`:""}</div><span class="number">${b}</span></div>`}
function stat(n,l){return `<div><div class="big number">${n}</div><div class="metric">${l}</div></div>`}
function hiddenMoney(n){return state.showNumbers?money(n):"•••••"}
function fullDate(iso){return new Date(iso+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}
function localISO(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}
function todayISO(){const now=localISO(new Date());return now<DATA.meta.referenceDate?DATA.meta.referenceDate:now}
function addMonth(iso){const d=new Date(iso+"T12:00:00");const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return localISO(d)}
function dueBills(){const start=new Date(todayISO()+"T00:00:00");const end=new Date(start);end.setDate(end.getDate()+31);return state.bills.filter(b=>b.status==="due"&&new Date(b.due+"T23:59:59")>=start&&new Date(b.due+"T00:00:00")<=end)}
function dueBillsTotal(){return dueBills().reduce((n,b)=>n+Number(b.amount||0),0)}
function safeToSpendNow(){const level=DATA.safeToSpend.bufferLevels.find(x=>x.name===state.buffer)||DATA.safeToSpend.bufferLevels[1];return {level,total:DATA.safeToSpend.available-dueBillsTotal()-DATA.safeToSpend.necessities-DATA.safeToSpend.savings-level.amount}}
function supportiveAction(){state.gardenGrowth=(state.gardenGrowth||0)+1;persist()}
function gardenMarkup(){const count=6+(state.gardenGrowth||0);const plants=["🌱","🌿","🌼","🌷","🍃","🌻","🌾","🪴"];return `<div class="garden" aria-label="Calm garden with ${count} plants">${Array.from({length:count},(_,i)=>`<span class="flower" style="animation-delay:${Math.min(i*.06,.6)}s">${plants[i%plants.length]}</span>`).join("")}</div><p class="smallprint">Your garden has ${count} small signs of progress · ${state.gardenGrowth||0} supportive actions added</p>`}
function progressRing(value){const circumference=282.74,offset=circumference*(1-value/100);return `<div class="progress-ring" role="img" aria-label="Calm progress ${value}%"><svg viewBox="0 0 100 100"><circle class="ring-track" cx="50" cy="50" r="45"></circle><circle class="ring-value" cx="50" cy="50" r="45" style="--ring-offset:${offset}"></circle></svg><span>${value}%</span></div>`}
function animateNumbers(){document.querySelectorAll(".number,.big").forEach(el=>{if(el.dataset.counted)return;const raw=el.textContent.trim();const m=raw.match(/^([$])([\d,]+)\.(\d{2})$/);if(!m)return;const target=Number(m[2].replace(/,/g,"")+"."+m[3]);if(!Number.isFinite(target))return;el.dataset.counted="1";const start=performance.now(),duration=650;const currency=state.currency||"USD";function tick(now){const t=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-t,3);el.textContent=new Intl.NumberFormat("en-US",{style:"currency",currency}).format(target*ease);if(t<1)requestAnimationFrame(tick)}requestAnimationFrame(tick)})}
function startBreathing(){if(window.__breathingInterval){clearInterval(window.__breathingInterval);window.__breathingInterval=null}if(!state.grounding||state.screen!=="Calm Plan")return;state.breathElapsed=state.breathElapsed||0;const update=()=>{const phase=(state.breathElapsed||0)%14;const label=phase<4?"Breathe in":phase<8?"Hold":"Breathe out";const el=$("#breathLabel");if(el)el.textContent=label;const circle=$("#breathCircle");if(circle)circle.setAttribute("aria-label",label);state.breathElapsed=(state.breathElapsed||0)+1};update();window.__breathingInterval=setInterval(update,1000)}
// One-time migration for records created by the earlier buyer-tested build.
if(!saved.entryAdjustments){

 const delta={};
 for(const entry of state.entries){
  const match=remaining.findIndex(x=>x.date===entry.date&&x.what===entry.what&&x.category===entry.category&&Number(x.amount)===Number(entry.amount));
  if(match>=0)remaining.splice(match,1);
  else if(DATA.spending.necessities.some(x=>x.category===entry.category))delta[entry.category]=(delta[entry.category]||0)+Number(entry.amount||0);
 }
 for(const entry of remaining)if(DATA.spending.necessities.some(x=>x.category===entry.category))delta[entry.category]=(delta[entry.category]||0)-Number(entry.amount||0);
 state.entryAdjustments=delta;
}
for(const bill of state.bills){

 }

function screenDebt(){return head("A CLEARER VIEW","Debt","Payoff months and interest are from the supplied amortisation simulation.")+
 `<div class="grid two">${DATA.debts.debts.map(d=>card(`<h2>${d.name}</h2><div class="big number">${hiddenMoney(d.balance)}</div><div class="muted">${(d.apr*100).toFixed(2)}% APR · due Nov ${d.dueDay}</div><div class="line"></div>${row("Minimum payment",hiddenMoney(d.minimum))}${row("Planned payment",hiddenMoney(d.planned))}${row("Planned payoff",fullDate(d.payoffPlanned))}${row("Months planned",d.monthsPlanned)}${row("Planned interest",hiddenMoney(d.interestPlanned))}`)).join("")}</div><div style="height:16px"></div>${card(`<h2>Payoff approaches</h2><div class="grid two">${card(`<h3>Snowball</h3><p>Credit card → Student loan</p>${stat("39 months","Payoff time")}${row("Interest",hiddenMoney(DATA.debts.snowball.interest))}${row("Payoff date",fullDate(DATA.debts.snowball.payoff))}`)}${card(`<h3>Avalanche</h3><p>Credit card → Student loan</p>${stat("39 months","Payoff time")}${row("Interest",hiddenMoney(DATA.debts.avalanche.interest))}${row("Payoff date",fullDate(DATA.debts.avalanche.payoff))}`)}</div><div class="line"></div>${row("Minimum-only comparison","66 months")}${row("Minimum-only interest",hiddenMoney(DATA.debts.minimumOnly.interest))}<p class="smallprint">The credit card is both the smallest balance and the highest APR.</p>`)}`}
function screenWorry(){return head("A PLACE TO SET IT DOWN","Worry Inbox","Worries are organised, not judged. Leaving one for today is also a choice.")+
 card(`<div class="row"><div><div class="big">${state.worries.filter(w=>w.status!=="Handled").length}</div><div class="muted">Open worries</div></div><div class="tag">3 / 4 worries with actions</div></div><div class="grid two" style="margin:14px 0">${Object.entries(DATA.worryInbox.counts).map(([label,count])=>`<div class="row smallprint"><span>${label}</span><strong>${count}</strong></div>`).join("")}</div><div class="list">${state.worries.map(w=>`<div class="item" style="align-items:flex-start"><div style="flex:1"><strong>${w.text}</strong><small>${w.status}</small>${w.actions?.length?`<div class="smallprint" style="margin-top:7px">Possible next steps: ${w.actions.join(" · ")}</div>`:"<div class='smallprint'>Noticing this is enough for now.</div>"}</div><div class="stack"><button class="pillbtn" data-worry="step:${w.id}">Add a next step</button><button class="pillbtn" data-worry="not:${w.id}">Not today</button><button class="pillbtn" data-worry="done:${w.id}">Mark handled</button><button class="pillbtn" data-worry="remove:${w.id}">Remove</button></div></div>`).join("")}</div><p class="smallprint">${DATA.worryInbox.copy}</p>`) }
function screenCalm(){return head("A QUIET PLACE TO LAND","Calm Plan","Your plan is here when you want it. Nothing needs to be solved all at once.")+
 `<div class="grid two">${card(`<div class="eyebrow">GROUNDING MODE</div><h2>${DATA.grounding.text}</h2><div class="circle" id="breathCircle" aria-label="Breathe in"><span id="breathLabel">Breathe in</span></div><div class="stat" style="text-align:center">${DATA.grounding.breathing.label}</div><p class="muted" style="text-align:center">Your numbers will be here when you are ready.</p><button class="btn primary" id="groundingBtn">${state.grounding?'End grounding':'Begin breathing'}</button>`)}
 ${card(`<div class="eyebrow">GENTLE NEXT STEPS</div><h2>Choose one small thing</h2><div class="field"><label>24 first-step templates</label><select id="templatePick">${DATA.firstStepTemplates.map((t,i)=>`<option value="${i}" ${i===state.templateIndex?'selected':''}>${t.name}</option>`).join("")}</select></div>${[0,1,2].map(i=>`<div class="field"><label>Step ${i+1}</label><input class="templateStep" data-step="${i}" value="${esc(state.templateSteps[i]||"")}"></div>`).join("")}<button class="btn soft" id="saveTemplate">Save my steps</button><div class="line"></div><h3>When things feel heavy</h3>${DATA.calmPlan.stepsWhenHeavy.map(x=>`<div class="item">${x}</div>`).join("")}`)}</div><div style="height:16px"></div>${card(`<h2>${DATA.progress.heading}</h2>${progressRing(DATA.progress.calmProgress)}${DATA.progress.areas.map(x=>`<div class="item"><span>${x.area}</span><strong>${x.done} / ${x.total}</strong></div>`).join("")}${gardenMarkup()}<p>${DATA.progress.summary.text}</p><p class="smallprint">November 21, 2026 · Progress grows from supportive actions, not balances.</p>`)}`}
function screenReview(){let c=DATA.returnReview.cards[state.reviewIndex];return head("A GENTLE WAY BACK","Returning after a pause","One card at a time. You can stop whenever you want.")+
 card(`<div class="row"><span class="tag">Card ${state.reviewIndex+1} of ${DATA.returnReview.cards.length}</span><span class="muted">No totals required</span></div><div class="review-card"><div class="eyebrow" style="margin-top:30px">A SMALL LOOK</div><h2 style="font-size:28px">${c.title}</h2><p class="focus-note">${state.showNumbers?c.detail:c.detail.replace(/\$[\d,]+(?:\.\d{2})?/g,"a number")}</p></div><div class="actions"><button class="btn" id="reviewPause">${DATA.returnReview.buttons[0]}</button><button class="btn" id="reviewHide">${DATA.returnReview.buttons[1]}</button><button class="btn soft" id="reviewSimple">${DATA.returnReview.buttons[2]}</button><button class="btn primary" id="reviewNext">${state.reviewIndex===4?'Finish':'Next card'}</button></div>`) }
function screenWhatIf(){let w=state.whatIf;let result=DATA.whatIf.baselineBreathingRoom-(DATA.money.incomeMonth*w.income/100)-w.expense-w.buffer+w.subs+w.enjoy;let recovery=result+DATA.whatIf.levers.pauseSubscriptions+DATA.whatIf.levers.reduceEnjoymentBy50+DATA.whatIf.levers.keepBufferFlat;return head("A SCENARIO TO EXPLORE","What-If planner","Change one lever at a time. This is a planning result, not a prediction or a verdict.")+
 card(`<div class="grid two">${[['income','Income lower by',0,40,'%'],['expense','Unexpected expense',0,500,'$'],['buffer','Increase buffer by',0,300,'$'],['subs','Pause subscriptions',0,17.99,'$'],['enjoy','Reduce flexible enjoyment',0,150,'$']].map(([k,l,min,max,suffix])=>`<div class="field"><label>${l}: <strong>${k==='income'?w[k]+'%':money(w[k])}</strong></label><input class="range" type="range" min="${min}" max="${max}" step="${k==='subs'?0.01:1}" value="${w[k]}" data-whatif="${k}"></div>`).join("")}</div><div class="line"></div><div class="eyebrow">ESTIMATED MONTHLY BREATHING ROOM</div><div class="big number">${hiddenMoney(result)}</div><p class="muted">${result<0?'This scenario is still short. The result is shown honestly.':'This scenario leaves some room in the plan.'}</p><div class="line"></div><h3>Levers that help</h3>${row("Pause subscriptions", "+"+money(DATA.whatIf.levers.pauseSubscriptions))}${row("Reduce enjoyment by $50", "+"+money(DATA.whatIf.levers.reduceEnjoymentBy50))}${row("Keep buffer flat", "+"+money(DATA.whatIf.levers.keepBufferFlat))}<div class="row"><strong>Recovered result</strong><strong class="big number">${hiddenMoney(recovery)}</strong></div><p class="smallprint">The scenario uses the supplied dataset values. What you see is a planning result, not a prediction or a verdict.</p>`) }
function settings(){return `<div class="pagehead"><div class="eyebrow">YOUR PREFERENCES</div><h1>Settings & privacy</h1><p>Your planner stays on this device. There is no account, subscription, bank connection or device linking.</p></div><div class="grid two">${card(`<h2>Appearance</h2><div class="field"><label>Theme</label><select id="themePick">${DATA.themes.names.map(t=>`<option ${state.theme===t?'selected':''}>${t}</option>`).join("")}</select></div><div class="field"><label>Text size</label><select id="fontPick">${DATA.themes.text_sizes.map(t=>`<option ${state.fontSize===t?'selected':''}>${t}</option>`).join("")}</select></div><label class="switch">Evening mode <input type="checkbox" id="eveningPick" ${state.evening?'checked':''}></label><label class="switch">Show numbers <input type="checkbox" id="numbersPick" ${state.showNumbers?'checked':''}></label>`)}
 ${card(`<h2>Regional preferences</h2><div class="field"><label>Currency</label><select id="currencyPick">${DATA.themes.currencies.map(c=>`<option ${state.currency===c?'selected':''}>${c}</option>`).join("")}</select></div><p class="smallprint">Date format: MM/DD/YYYY · English (US)</p><h2>Start fresh</h2><p>Clear Mara's example figures and begin with an empty planner on this device.</p><button class="btn danger" id="useMyNumbers">Use my numbers · Start empty</button><div class="line"></div><h2>Privacy & backups</h2><p>Last backup: Nov 18, 2026 (3 days ago). Reminder every 14 days.</p><div class="stack"><button class="btn" id="exportJson">Export backup (JSON)</button><button class="btn" id="importJson">Restore backup</button><button class="btn" id="exportCsv">Export transactions (CSV)</button><button class="btn" id="printBtn">Print</button><input type="file" id="fileInput" accept=".json,application/json" class="hidden"></div><p class="smallprint">Backup filename: ${DATA.privacy.backupFileName}</p>`)}</div>`}
function emptyScreen(){return head("A FRESH START","Your planner is ready","Mara's example information has been cleared from this planner on this device.")+
 card(`<h2>Begin with your own numbers</h2><p class="muted">Add a bill, record a spending entry, or set up a goal when you feel ready. Nothing is connected to a bank.</p><div class="actions"><button class="btn primary" data-empty-add="entry">Add a spending entry</button><button class="btn" data-empty-add="bill">Add a bill</button><button class="btn" data-empty-add="goal">Add a savings goal</button></div><div class="line"></div><h3>Your entries</h3>${state.entries.length?state.entries.map((e,i)=>row(esc(e.what),hiddenMoney(e.amount),date(e.date)+" · "+esc(e.category))).join(""):"<p class='muted'>No spending entries yet.</p>"}<h3>Your bills</h3>${state.bills.length?state.bills.map(b=>row(esc(b.name),hiddenMoney(b.amount),date(b.due))).join(""):"<p class='muted'>No bills added yet.</p>"}<h3>Your savings goals</h3>${state.goals.length?state.goals.map(g=>row(esc(g.name),hiddenMoney(g.saved),"of "+money(g.target))).join(""):"<p class='muted'>No savings goals added yet.</p>"}`)}
function applyTheme(){document.body.classList.remove("theme-mist","theme-stone","theme-sea","theme-blush","theme-forest","theme-night");let map={"Morning Mist":"theme-mist","Warm Stone":"theme-stone","Sea Glass":"theme-sea","Blush Cloud":"theme-blush","Forest Floor":"theme-forest","Night Rain":"theme-night"};if(map[state.theme])document.body.classList.add(map[state.theme]);document.body.classList.toggle("evening",state.evening||state.theme==="Evening Calm"||state.theme==="Night Rain");document.body.classList.toggle("hidden-numbers",!state.showNumbers);document.body.classList.toggle("grounding-active",state.grounding);document.body.classList.toggle("view-gentle",state.view==="Gentle");document.body.classList.toggle("view-full",state.view==="Full");document.body.style.fontSize=state.fontSize+"px";document.body.style.fontFamily=state.evening?'system-ui,Arial,sans-serif':'Georgia,system-ui,serif'}
function render(){applyTheme();nav();$("#viewToggle").textContent=state.view+" view";$("#hideToggle").textContent=state.showNumbers?"◉ Hide the numbers":"◉ Show the numbers";let fn={Home:screenHome,"Check-In":screenCheck,"My Money":screenMoney,"Safe to Spend":screenSafe,Bills:screenBills,Spending:screenSpending,"Permission to Spend":screenPermission,Savings:screenSavings,Debt:demoLockedDebt,"Worry Inbox":demoLockedWorry,"Calm Plan":demoLockedCalm};$("#screen").innerHTML=state.screen==="Settings"?settings():state.emptyStart?emptyScreen():state.screen==="Returning after a pause"?screenReview():state.screen==="What-If planner"?screenWhatIf():fn[state.screen]();bind();animateNumbers();startBreathing();persist();var _dl=document.getElementById('demoLeft');if(_dl)_dl.textContent=demoLeft()+' of 15 left to add';}
function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function openModal(content){$("#dialog").innerHTML=content;$("#modal").classList.add("open")}
function closeModal(){$("#modal").classList.remove("open")}
function bind(){
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
 document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{state.beginMode=b.dataset.mode;render()});
 document.querySelectorAll("[data-word]").forEach(b=>b.onclick=()=>{state.checkWord=b.dataset.word;render()});
 document.querySelectorAll("[data-buffer]").forEach(b=>b.onclick=()=>{state.buffer=b.dataset.buffer;render();toast("Comfort setting updated")});
 document.querySelectorAll("[data-paid]").forEach(b=>b.onclick=()=>{let bill=state.bills.find(x=>x.name===b.dataset.paid);if(bill){const handledOn=todayISO();bill.lastHandled=handledOn;bill.due=addMonth(bill.due);bill.status="due";state.handledHistory.unshift({name:bill.name,amount:bill.amount,handledOn,nextDue:bill.due});supportiveAction();toast(bill.name+" marked handled · next due "+date(bill.due));render()}});
 document.querySelectorAll("[data-worry]").forEach(b=>b.onclick=()=>{let [action,id]=b.dataset.worry.split(":");let w=state.worries.find(x=>x.id===id);if(action==="remove")state.worries=state.worries.filter(x=>x.id!==id);else if(w&&action==="step"){if(demoAddedCount()>=15){demoLimitModal();return}const step=prompt("What is one small next step for this worry?");if(step&&step.trim()){w.actions=w.actions||[];w.actions.push(step.trim());supportiveAction()}}else if(w)w.status=action==="done"?"Handled":"Can wait";toast(action==="remove"?"Worry removed":"Worry updated");render()});
 document.querySelectorAll("[data-contribute]").forEach(b=>b.onclick=()=>{let g=state.goals.find(x=>x.id===b.dataset.contribute);openModal(`<h2>Add a contribution</h2><p class="muted">${g.name}</p><div class="field"><label>Amount</label><input id="contribAmount" type="number" min="0" step=".01" value="${g.monthly}"></div><div class="actions"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="confirmContrib">Add contribution</button></div>`);$("#cancelModal").onclick=closeModal;$("#confirmContrib").onclick=()=>{let v=Number($("#contribAmount").value);if(v>0){if(demoAddedCount()>=15){demoLimitModal();return}state.demoContribs=(state.demoContribs||0)+1;g.saved=Math.min(g.target,g.saved+v);g.remaining=Math.max(0,g.target-g.saved);g.pct=Math.round(g.saved/g.target*100);supportiveAction();toast("Contribution added");closeModal();render()}}});
 document.querySelectorAll("[data-edit-entry]").forEach(b=>b.onclick=()=>{const idx=Number(b.dataset.editEntry),e=state.entries[idx];openModal(`<h2>Edit spending entry</h2><div class="field"><label>Date</label><input id="editEntryDate" type="date" value="${e.date}"></div><div class="field"><label>What was it?</label><input id="editEntryWhat" value="${esc(e.what)}"></div><div class="field"><label>Category</label><select id="editEntryCat">${["Groceries","Transport","Household","Personal","Eating out","Hobbies","Rest & comfort"].map(x=>`<option ${e.category===x?'selected':''}>${x}</option>`).join("")}</select></div><div class="field"><label>Amount</label><input id="editEntryAmount" type="number" min="0" step=".01" value="${e.amount}"></div><div class="actions"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="saveEditedEntry">Save changes</button></div>`);$("#cancelModal").onclick=closeModal;$("#saveEditedEntry").onclick=()=>{const old=state.entries[idx],amount=Number($("#editEntryAmount").value),category=$("#editEntryCat").value,what=$("#editEntryWhat").value.trim();if(!what||amount<=0)return toast("Add a description and an amount");if(DATA.spending.necessities.some(x=>x.category===old.category))state.entryAdjustments[old.category]=(Number(state.entryAdjustments[old.category])||0)-Number(old.amount);if(DATA.spending.necessities.some(x=>x.category===category))state.entryAdjustments[category]=(Number(state.entryAdjustments[category])||0)+amount;state.entries[idx]={date:$("#editEntryDate").value,what,amount,category};closeModal();render();toast("Entry updated")}}); 
 document.querySelectorAll("[data-delete-entry]").forEach(b=>b.onclick=()=>{const idx=Number(b.dataset.deleteEntry),e=state.entries[idx];if(!confirm("Remove this spending entry?"))return;if(DATA.spending.necessities.some(x=>x.category===e.category))state.entryAdjustments[e.category]=(Number(state.entryAdjustments[e.category])||0)-Number(e.amount);state.entries.splice(idx,1);render();toast("Entry removed")});
 document.querySelectorAll("[data-empty-add]").forEach(b=>b.onclick=()=>{
 const kind=b.dataset.emptyAdd;
 if(kind==="entry"){openModal(`<h2>Add a spending entry</h2><div class="field"><label>Date</label><input id="entryDate" type="date" value="${todayISO()}"></div><div class="field"><label>What was it?</label><input id="entryWhat"></div><div class="field"><label>Category</label><select id="entryCat">${["Groceries","Transport","Household","Personal","Eating out","Hobbies","Rest & comfort"].map(x=>`<option>${x}</option>`).join("")}</select></div><div class="field"><label>Amount</label><input id="entryAmount" type="number" min="0" step=".01"></div><div class="actions"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="saveEmptyEntry">Save entry</button></div>`);$("#saveEmptyEntry").onclick=()=>{const amount=Number($("#entryAmount").value),what=$("#entryWhat").value.trim();if(!what||amount<=0)return toast("Add a description and an amount");if(demoAddedCount()>=15){demoLimitModal();return}state.entries.unshift({date:$("#entryDate").value,what,amount,category:$("#entryCat").value});closeModal();render();toast("Entry saved")}}
 if(kind==="bill"){openModal(`<h2>Add a bill</h2><div class="field"><label>Bill name</label><input id="emptyBillName"></div><div class="field"><label>Amount</label><input id="emptyBillAmount" type="number" min="0" step=".01"></div><div class="field"><label>Next due date</label><input id="emptyBillDate" type="date" value="${todayISO()}"></div><div class="actions"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="saveEmptyBill">Save bill</button></div>`);$("#saveEmptyBill").onclick=()=>{const name=$("#emptyBillName").value.trim(),amount=Number($("#emptyBillAmount").value),due=$("#emptyBillDate").value;if(!name||amount<=0||!due)return toast("Complete the bill details");if(demoAddedCount()>=15){demoLimitModal();return}state.bills.push({name,amount,due,status:"due"});closeModal();render();toast("Bill saved")}}
 if(kind==="goal"){openModal(`<h2>Add a savings goal</h2><div class="field"><label>Goal name</label><input id="emptyGoalName"></div><div class="field"><label>Target amount</label><input id="emptyGoalTarget" type="number" min="1" step=".01"></div><div class="field"><label>Monthly contribution</label><input id="emptyGoalMonthly" type="number" min="0" step=".01"></div><div class="actions"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="saveEmptyGoal">Save goal</button></div>`);$("#saveEmptyGoal").onclick=()=>{const name=$("#emptyGoalName").value.trim(),target=Number($("#emptyGoalTarget").value),monthly=Number($("#emptyGoalMonthly").value);if(!name||target<=0)return toast("Add a name and target");if(demoAddedCount()>=15){demoLimitModal();return}state.goals.push({id:"goal-"+Date.now(),name,target,saved:0,monthly,remaining:target,pct:0,fundedBy:"Not set"});closeModal();render();toast("Savings goal saved")}}
 });
 $("#useMyNumbers")?.addEventListener("click",()=>openModal(`<h2>Start with an empty planner?</h2><p class="muted">This clears Mara's example bills, entries, worries and savings goals from this device. You can begin entering your own information afterwards.</p><div class="actions"><button class="btn" id="cancelModal">Keep example</button><button class="btn danger" id="confirmEmpty">Clear example data</button></div>`));
 $("#saveCheck")?.addEventListener("click",()=>{if(demoAddedCount()>=15){demoLimitModal();return}let note=$("#checkNote").value;DATA.checkIn.history.push({date:DATA.meta.referenceDate,word:state.checkWord,manageability:Number($("#manageRange").value),note});state.manageability=Number($("#manageRange").value);supportiveAction();toast("Check-in saved");render()});
 $("#addEntry")?.addEventListener("click",()=>{openModal(`<h2>Add a spending entry</h2><div class="field"><label>Date</label><input id="entryDate" type="date" value="2026-11-21"></div><div class="field"><label>What was it?</label><input id="entryWhat" placeholder="A short note"></div><div class="field"><label>Category</label><select id="entryCat">${["Groceries","Transport","Household","Personal","Eating out","Hobbies","Rest & comfort"].map(x=>`<option>${x}</option>`).join("")}</select></div><div class="field"><label>Amount</label><input id="entryAmount" type="number" min="0" step=".01"></div><div class="actions"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="saveEntry">Save entry</button></div>`);$("#cancelModal").onclick=closeModal;$("#saveEntry").onclick=()=>{let amount=Number($("#entryAmount").value),what=$("#entryWhat").value.trim();if(!what||amount<=0){toast("Add a description and an amount");return}if(demoAddedCount()>=15){demoLimitModal();return}const category=$("#entryCat").value;state.entries.unshift({date:$("#entryDate").value,what,amount,category});if(DATA.spending.necessities.some(x=>x.category===category))state.entryAdjustments[category]=(Number(state.entryAdjustments[category])||0)+amount;closeModal();render();toast("Entry saved on this device")}});
 $("#templatePick")?.addEventListener("change",e=>{state.templateIndex=Number(e.target.value);state.templateSteps=DATA.firstStepTemplates[state.templateIndex].steps.slice();render()});
 $("#saveTemplate")?.addEventListener("click",()=>{state.templateSteps=[...document.querySelectorAll(".templateStep")].map(x=>x.value);toast("Your editable steps are saved")});
 $("#groundingBtn")?.addEventListener("click",()=>{state.grounding=!state.grounding;if(state.grounding)state.breathElapsed=0;render();toast(state.grounding?"Take your time":"Grounding paused")});
 document.querySelectorAll("[data-whatif]").forEach(el=>el.oninput=()=>{state.whatIf[el.dataset.whatif]=Number(el.value);render()});
 $("#reviewPause")?.addEventListener("click",()=>{state.reviewPaused=true;toast("You can return whenever you like");go("Home")});
 $("#reviewHide")?.addEventListener("click",()=>{state.showNumbers=false;render()});
 $("#reviewSimple")?.addEventListener("click",()=>{state.beginMode="One small step, no numbers";state.reviewIndex=4;render()});
 $("#reviewNext")?.addEventListener("click",()=>{if(state.reviewIndex<DATA.returnReview.cards.length-1)state.reviewIndex++;else{if(!state.reviewCompleted){state.reviewCompleted=true;supportiveAction()}toast("You made it through the review");go("Home");return}render()});
 $("#themePick")?.addEventListener("change",e=>{state.theme=e.target.value;render()});
 $("#fontPick")?.addEventListener("change",e=>{state.fontSize=Number(e.target.value);render()});
 $("#eveningPick")?.addEventListener("change",e=>{state.evening=e.target.checked;render()});
 $("#numbersPick")?.addEventListener("change",e=>{state.showNumbers=e.target.checked;render()});
 $("#currencyPick")?.addEventListener("change",e=>{state.currency=e.target.value;render()});
 $("#exportJson")?.addEventListener("click",()=>download(DATA.privacy.backupFileName,JSON.stringify({product:DATA.meta.product,exportedAt:new Date().toISOString(),state},null,2),"application/json"));
 $("#importJson")?.addEventListener("click",()=>$("#fileInput").click());
 $("#fileInput")?.addEventListener("change",async e=>{let f=e.target.files[0];if(!f)return;try{let j=JSON.parse(await f.text());if(!j.state)throw new Error("Invalid backup");state={...state,...j.state};toast("Backup restored");render()}catch(err){toast("That backup file could not be read") }});
 $("#exportCsv")?.addEventListener("click",()=>{let lines=[["Date","Description","Category","Amount"],...state.entries.map(x=>[x.date,x.what,x.category,x.amount])];let csv=lines.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");download("Anxiety-Friendly-Budget-Planner-transactions.csv",csv,"text/csv")});
 $("#printBtn")?.addEventListener("click",()=>window.print());
}
$("#mobileNav").addEventListener("change",e=>go(e.target.value));
$("#viewToggle").addEventListener("click",()=>{let a=DATA.home.views;state.view=a[(a.indexOf(state.view)+1)%a.length];render();toast(state.view+" view")});
$("#hideToggle").addEventListener("click",()=>{state.showNumbers=!state.showNumbers;render()});
$("#settingsBtn").addEventListener("click",()=>go("Settings"));
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("click",e=>{if(e.target.id==="cancelModal")closeModal();if(e.target.id==="confirmEmpty"){state.emptyStart=true;state.entries=[];state.worries=[];state.bills=[];state.goals=[];state.handledHistory=[];state.entryAdjustments={};state.gardenGrowth=0;state.reviewCompleted=false;state.checkWord="";state.manageability=null;state.breathElapsed=0;state.grounding=false;state.whatIf={income:0,expense:0,buffer:0,subs:0,enjoy:0};state.templateIndex=0;state.templateSteps=["","",""];state.beginMode="One small step, no numbers";state.screen="Home";closeModal();render();toast("Example data cleared. Your planner is empty.")}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
window.__ANXIETY_APP_TEST__={get state(){return state},get data(){return DATA},navigate:go};
render();
</script></body></html>
